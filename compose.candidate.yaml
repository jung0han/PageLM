name: qai-pagelm-candidate

services:
  mock-openai:
    image: node:22.16.0-alpine@sha256:41e4389f3d988d2ed55392df4db1420ad048ae53324a8e2b7c6d19508288107e
    command: ["node", "/candidate/mock-openai.mjs"]
    volumes:
      - ./scripts/mock-openai.mjs:/candidate/mock-openai.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/health"]
      interval: 5s
      timeout: 2s
      retries: 6
    restart: unless-stopped
    ports:
      - "127.0.0.1:14010:4010"

  backend:
    image: ${CANDIDATE_BACKEND_IMAGE:-qai-pagelm-backend:candidate}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        FORK_REVISION: ${FORK_REVISION:-development}
        UPSTREAM_REVISION: b3b4895fb3a180088b897705816a5a9786d79a92
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      VITE_BACKEND_URL: http://127.0.0.1:15000
      VITE_FRONTEND_URL: http://127.0.0.1:15173
      OPENAI_API_KEY: ${CANDIDATE_OPENAI_API_KEY:-candidate-local-stub}
      LITELLM_API_KEY: ${CANDIDATE_LITELLM_API_KEY:-candidate-local-stub}
      LITELLM_BASE_URL: http://mock-openai:4010/v1
      LITELLM_DEFAULT_MODEL_ALIAS: pagelm-default
      LITELLM_ALLOWED_MODEL_ALIASES: pagelm-default,pagelm-fast
      VERTEX_PROJECT_ID: candidate
      VERTEX_LOCATION: asia-northeast3
      VERTEX_API_ENDPOINT: http://mock-openai:4010/v1
      VERTEX_ACCESS_TOKEN: ${CANDIDATE_VERTEX_ACCESS_TOKEN:-candidate-local-stub}
      MILVUS_ADDRESS: milvus:19530
      MILVUS_COLLECTION: pagelm_chunks
      AUTHENTIK_AUTHORIZATION_URL: http://127.0.0.1:14010/oidc/authorize
      AUTHENTIK_TOKEN_URL: http://mock-openai:4010/oidc/token
      AUTHENTIK_USERINFO_URL: http://mock-openai:4010/oidc/userinfo
      AUTHENTIK_REVOCATION_URL: http://mock-openai:4010/oidc/revoke
      AUTHENTIK_CLIENT_ID: ${CANDIDATE_AUTHENTIK_CLIENT_ID:-candidate-pagelm}
      AUTHENTIK_CLIENT_SECRET: ${CANDIDATE_AUTHENTIK_CLIENT_SECRET:-candidate-local-stub}
      AUTHENTIK_REDIRECT_URI: http://127.0.0.1:15000/auth/callback
      QAI_PERSON_RESOLVER_URL: http://mock-openai:4010/qai/person
      QAI_PERSON_RESOLVER_TOKEN: ${CANDIDATE_QAI_RESOLVER_TOKEN:-candidate-local-stub}
    volumes:
      - pagelm-storage:/app/storage
    ports:
      - "127.0.0.1:15000:5000"
    depends_on:
      mock-openai:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "--advertise-client-urls=http://127.0.0.1:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - pagelm-etcd:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["minio", "server", "/minio_data"]
    volumes:
      - pagelm-minio:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - pagelm-milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    image: ${CANDIDATE_FRONTEND_IMAGE:-qai-pagelm-frontend:candidate}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        FORK_REVISION: ${FORK_REVISION:-development}
        UPSTREAM_REVISION: b3b4895fb3a180088b897705816a5a9786d79a92
        VITE_BACKEND_URL: http://127.0.0.1:15000
        VITE_TIMEOUT: 90000
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pagelm-storage:
  pagelm-etcd:
  pagelm-minio:
  pagelm-milvus:

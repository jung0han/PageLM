name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [ qai-main, main, develop ]
  pull_request:
    branches: [ qai-main, main, develop ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.13.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22.16.0
        cache: 'npm'
    
    # Backend validation
    - name: Install backend dependencies
      run: npm ci --legacy-peer-deps
      working-directory: ./
    
    - name: Build backend
      run: npm run build
      working-directory: ./

    - name: Test backend
      run: npm test

    - name: Verify pinned upstream ancestry
      run: node scripts/verify-provenance.mjs
    
    # Frontend validation
    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./frontend
    
    - name: Build frontend
      run: pnpm run build
      working-directory: ./frontend
    
    # Security and dependency checks
    - name: Run npm audit (backend)
      run: npm audit --audit-level=moderate
      working-directory: ./
      continue-on-error: true
    
    - name: Run pnpm audit (frontend)
      run: pnpm audit --audit-level=moderate
      working-directory: ./frontend
      continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: pagelm-backend:test
        build-args: |
          FORK_REVISION=${{ github.sha }}
          UPSTREAM_REVISION=b3b4895fb3a180088b897705816a5a9786d79a92
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: pagelm-frontend:test
        build-args: |
          FORK_REVISION=${{ github.sha }}
          UPSTREAM_REVISION=b3b4895fb3a180088b897705816a5a9786d79a92
          VITE_BACKEND_URL=http://127.0.0.1:15000
          VITE_TIMEOUT=90000
        cache-from: type=gha
        cache-to: type=gha,mode=max

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.13.1
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22.16.0
    
    - name: Install dependencies (backend)
      run: npm ci --legacy-peer-deps
      working-directory: ./
    
    - name: Check for known vulnerabilities (backend)
      run: npm audit --audit-level=high
      working-directory: ./
      continue-on-error: true
    
    - name: Install dependencies (frontend)
      run: pnpm install --frozen-lockfile
      working-directory: ./frontend
    
    - name: Check for known vulnerabilities (frontend)
      run: pnpm audit --audit-level=high
      working-directory: ./frontend
      continue-on-error: true

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, docker-build, dependency-check]
    if: always()
    
    steps:
    - name: Check results
      run: |
        if [[ "${{ needs.validate.result }}" == "failure" || \
              "${{ needs.docker-build.result }}" == "failure" || \
              "${{ needs.dependency-check.result }}" == "failure" ]]; then
          echo "❌ Some validation checks failed"
          exit 1
        else
          echo "✅ All validation checks passed"
        fi

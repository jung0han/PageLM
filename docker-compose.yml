version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: pagelm-backend
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      MILVUS_ADDRESS: milvus:19530
    volumes:
      - pagelm-storage:/app/storage
    ports:
      - "5000:5000"
    depends_on:
      milvus:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "--advertise-client-urls=http://127.0.0.1:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - pagelm-etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["minio", "server", "/minio_data"]
    volumes:
      - pagelm-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - pagelm-milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_TIMEOUT: 90000
    container_name: pagelm-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pagelm-storage:
  pagelm-etcd:
  pagelm-minio:
  pagelm-milvus:

name: pagelm-development

x-development-env-file: &development_env_file
  - ${PAGELM_DEVELOPMENT_ENV_FILE:-.env.development.example}

services:
  backend:
    image: node:22-alpine
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        npm ci
        exec npm run dev
    env_file: *development_env_file
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      VITE_BACKEND_URL: http://127.0.0.1:15000
      VITE_FRONTEND_URL: http://127.0.0.1:15173
      MILVUS_ADDRESS: milvus:19530
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm-proxy:4000}
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-http://authentik-server-1:9000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
    volumes:
      - .:/workspace:rw
    ports:
      - 127.0.0.1:${PAGELM_DEV_BACKEND_PORT:-15000}:5000
    depends_on:
      milvus:
        condition: service_healthy
    networks: [shared-network]

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command:
      - sh
      - -ec
      - |
        corepack enable
        pnpm install --frozen-lockfile
        exec pnpm dev --host 0.0.0.0 --port 5173
    env_file: *development_env_file
    environment:
      VITE_BACKEND_URL: http://127.0.0.1:15000
      VITE_TIMEOUT: 90000
    volumes:
      - .:/workspace:rw
    ports:
      - 127.0.0.1:${PAGELM_DEV_FRONTEND_PORT:-15173}:5173
    depends_on: [backend]
    networks: [shared-network]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "--advertise-client-urls=http://127.0.0.1:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: [pagelm-development-etcd:/etcd]
    networks: [shared-network]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: development
      MINIO_ROOT_PASSWORD: development-placeholder
    command: ["minio", "server", "/minio_data"]
    volumes: [pagelm-development-minio:/minio_data]
    networks: [shared-network]

  milvus:
    image: milvusdb/milvus:v2.6.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Keep the lane-local MinIO credentials aligned with the MinIO service.
      # These are development-only placeholders, never production secrets.
      MINIO_ACCESS_KEY_ID: development
      MINIO_SECRET_ACCESS_KEY: development-placeholder
    volumes: [pagelm-development-milvus:/var/lib/milvus]
    depends_on: [etcd, minio]
    networks: [shared-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  shared-network:
    name: shared-network
    external: true

volumes:
  pagelm-development-etcd:
  pagelm-development-minio:
  pagelm-development-milvus:
